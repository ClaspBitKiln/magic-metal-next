name: Procurement swarm CI

on:
  push:
    branches: [procurement-komtender-mvp]
  pull_request:
    branches: [procurement-komtender-mvp]

jobs:
  test-swarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec vitest run tests/int/swarm-supervisor.int.spec.ts
      - run: pnpm exec tsc --noEmit
