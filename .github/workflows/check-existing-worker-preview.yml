name: Check existing temporary preview
on:
  push:
    branches: [free-ci/sheets-20261105]
    paths: ['.github/workflows/check-existing-worker-preview.yml']
permissions:
  contents: read
jobs:
  browser:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    outputs:
      status: ${{ steps.probe.outputs.status }}
    timeout-minutes: 6
    env:
      BASE_URL: https://magic-metal-plan-b-preview.peach-tuna.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Diagnose live browser hydration without another deployment
        id: probe
        run: node .github/scripts/probe-public-preview.mjs
  diagnostic-result:
    needs: browser
    if: always() && github.event.repository.private == false
    name: '${{ needs.browser.outputs.status }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo 'Read-only public browser diagnostics.'
