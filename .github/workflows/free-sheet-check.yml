name: Free sheet verification

on:
  push:
    branches: [free-ci/sheets-20261105]
    paths: ['src/**', 'public/**', 'tests/**', 'package.json', 'package-lock.json', 'next.config.ts', 'playwright*.ts']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-sheets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_YANDEX_METRIKA_ID: '0'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Verify sheet selection and request context
        run: npm run test:int -- tests/int/sheet-format-picker.int.spec.ts tests/int/galvanized-selection.int.spec.ts tests/int/special-sheet-request.int.spec.ts tests/int/nonferrous-sheet-request.int.spec.ts tests/int/bronze-shape-request.int.spec.ts tests/int/specification-request-context.int.spec.ts
      - run: npx playwright install --with-deps chromium
      - name: Build this exact commit
        run: npm run build -- --webpack
      - name: Start local application
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/free-sheet-next.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          tail -40 /tmp/free-sheet-next.log
          exit 1
      - name: Verify sheets and attachment navigation without sending requests
        run: npx playwright test --config=playwright.documentation.config.ts tests/e2e/sheet-selection.e2e.spec.ts tests/e2e/specification-context.e2e.spec.ts --output=test-results/sheets --reporter=github,line
      - name: Preserve the other account's form navigation
        run: npx playwright test --config=playwright.catalog-kind.config.ts tests/e2e/nonferrous-kind-navigation.e2e.spec.ts --output=test-results/kinds --reporter=github,line
      - name: Record exact source and outcome
        if: always()
        env:
          VERIFY_RESULT: ${{ job.status }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Sheet verification
          Source: $GITHUB_SHA
          Result before summary: $VERIFY_RESULT
          Reports: test outcomes and failures are in the run log and check annotations.
          No artifact upload or billable artifact storage is used.
          This workflow runs the site locally on the GitHub runner. It does not deploy Vercel or provide public hosting.
          No production credentials or real email are configured.
          EOF
