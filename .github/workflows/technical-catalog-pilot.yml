name: Technical Catalog UI verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/(frontend)/(catalog)/produkciya/[slug]/[detail]/page.tsx'
      - 'src/app/(frontend)/(catalog)/produkciya/[slug]/[detail]/pipe-detail.css'
      - 'src/app/(frontend)/(catalog)/produkciya/sdt/[detail]/page.tsx'
      - 'src/components/TechnicalCatalogSummary.tsx'
      - 'src/components/ProductDocumentation.css'
      - 'src/components/NonferrousRequestPicker.tsx'
      - 'src/components/SheetFormatPicker.tsx'
      - 'src/components/GalvanizedRequestPicker.tsx'
      - 'src/components/SpecialSheetRequestPicker.tsx'
      - 'tests/e2e/sheet-selection.e2e.spec.ts'
      - 'tests/e2e/specification-context.e2e.spec.ts'
      - 'playwright.sheets-current.config.ts'
      - 'tests/int/sheet-format-picker.int.spec.ts'
      - 'tests/int/galvanized-selection.int.spec.ts'
      - 'tests/int/nonferrous-sheet-request.int.spec.ts'
      - 'tests/int/special-sheet-request.int.spec.ts'
      - 'src/components/CardPickerReadability.css'
      - 'src/data/catalogProductKinds.ts'
      - 'src/data/nonferrousShapes.ts'
      - 'src/components/CatalogKindLinks.tsx'
      - 'src/components/CatalogKindLinks.css'
      - 'src/components/CatalogKindFallback.tsx'
      - 'src/components/useCatalogKind.ts'
      - 'src/components/FastenerRequestPicker.tsx'
      - 'src/components/SpecialProcurementPicker.tsx'
      - 'src/components/MeshRopeRequestPicker.tsx'
      - 'src/components/CatalogTree.tsx'
      - 'src/app/(frontend)/(catalog)/produkciya/[slug]/page.tsx'
      - 'public/home-static.html'
      - 'playwright.catalog-kind.config.ts'
      - 'tests/e2e/catalog-kind-navigation.e2e.spec.ts'
      - 'tests/e2e/mesh-kind-navigation.e2e.spec.ts'
      - 'tests/e2e/nonferrous-kind-navigation.e2e.spec.ts'
      - 'tests/e2e/approved-product-card-a.e2e.spec.ts'
      - 'tests/e2e/nonferrous-unrestricted-request.e2e.spec.ts'
      - 'playwright.card-final.config.ts'
      - 'src/components/ProductSizeSeries.tsx'
      - 'src/components/ProductSizeSeries.css'
      - 'src/components/CatalogStockAssortment.tsx'
      - 'tests/e2e/product-documentation.e2e.spec.ts'
      - 'tests/e2e/technical-catalog-pilot.e2e.spec.ts'
      - 'playwright.documentation.config.ts'
      - 'playwright.pilot.config.ts'
      - '.github/workflows/technical-catalog-pilot.yml'

permissions:
  contents: read

jobs:
  pilot-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify simplified sheet requests
        run: npm run test:int -- tests/int/sheet-format-picker.int.spec.ts tests/int/galvanized-selection.int.spec.ts tests/int/nonferrous-sheet-request.int.spec.ts tests/int/special-sheet-request.int.spec.ts
      - run: npx playwright install --with-deps chromium firefox
      - name: Build exactly this PR (no remote preview auth required)
        run: npm run build -- --webpack
      - name: Start built application
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/technical-catalog.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/technical-catalog.log
          exit 1
      - name: Verify technical summary, responsive layout and RFQ navigation
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test --config=playwright.pilot.config.ts
      - name: Verify all 77 documentation cards and request flow
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test --config=playwright.card-final.config.ts
      - name: Verify visible product kinds and selected request context
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test --config=playwright.catalog-kind.config.ts
      - name: Verify simplified sheet selection and specification context
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test --config=playwright.sheets-current.config.ts sheet-selection.e2e.spec.ts specification-context.e2e.spec.ts
      - name: Check native Chromium browser zoom 200% (Xvfb + X11 input)
        env:
          BASE_URL: http://127.0.0.1:3000
        run: |
          sudo apt-get install -y xdotool xvfb
          for product in ugolok shveller balka-dvutavrovaya kvadrat shestigrannik katanka polosa krug-goryachekatanyj armatura shveller-gnutyj krug-i-kvadrat balka-shveller-ugolok; do
            xvfb-run -a -s '-screen 0 1920x1080x24' node scripts/verify-angle-native-zoom.mjs "$product"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technical-catalog-pilot-screenshots
          path: |
            test-results
            playwright-report-pilot
          if-no-files-found: ignore


