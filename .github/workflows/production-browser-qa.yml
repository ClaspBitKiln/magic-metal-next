name: Production browser QA

on:
  workflow_dispatch:
  deployment_status:
  pull_request:
    branches:
      - main

concurrency:
  group: production-browser-qa-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    name: Playwright (${{ matrix.browser }})
    # Playwright 1.58 supports Ubuntu 24.04; ubuntu-latest is migrating to 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test request delivery failure handling (mocked, no external mail)
        if: github.event_name == 'pull_request' && matrix.browser == 'chromium'
        run: npx vitest run --config ./vitest.config.mts tests/int/request-delivery-failover.int.spec.ts
      - name: Build and start pull request locally
        if: github.event_name == 'pull_request'
        run: |
          npm run build
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/magicmet-next.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/magicmet-next.log
          exit 1
      - name: Test complete site flow
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:3000' || 'https://magicmet.ru' }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
        run: npx playwright test --config=playwright.production.config.ts --project=${{ matrix.browser }} --reporter=line,html,json
      - name: Summarize browser failures
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file = 'test-results/results.json';
          if (!fs.existsSync(file)) process.exit(0);
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          const escape = text => text.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const failures = [];
          function visit(suite) {
            for (const spec of suite.specs || []) for (const test of spec.tests || []) {
              if (test.status !== 'unexpected') continue;
              const result = [...test.results].reverse().find(result => result.error);
              const message = `${spec.title}: ${result?.error?.message || 'Unexpected result'}`;
              failures.push(message);
              console.log(`::error file=${spec.file},line=${spec.line},title=Browser test failed::${escape(message.slice(0, 3500))}`);
            }
            for (const child of suite.suites || []) visit(child);
          }
          for (const suite of report.suites || []) visit(suite);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Browser checks\n\n${JSON.stringify(report.stats)}\n\n${failures.map(message => '```text\n' + message.slice(0, 3500) + '\n```').join('\n\n')}\n`);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  lighthouse:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit live production
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.production.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lhci-report
          if-no-files-found: ignore
