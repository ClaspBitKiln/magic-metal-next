name: RFQ confirmation test
on:
  pull_request:
    paths:
      - 'src/components/RequestForm.tsx'
      - 'src/lib/analytics.ts'
      - 'public/home.js'
      - 'tests/int/request-confirmation.int.spec.ts'
      - '.github/workflows/rfq-confirmation-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run --config ./vitest.config.mts tests/int/request-confirmation.int.spec.ts
