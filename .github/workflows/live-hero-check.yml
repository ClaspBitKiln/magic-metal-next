name: Verify published homepage and search
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-hero-check.yml
      - public/home-static.html
      - public/home.js
      - src/components/SizeTableFilter.tsx
      - src/components/CatalogSearch.tsx
      - 'src/app/(frontend)/(catalog)/poisk/**'
permissions:
  contents: write
concurrency:
  group: live-hero-check
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Wait for the updated homepage script
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const expected=fs.readFileSync('public/home-static.html','utf8').match(/src="(\/home\.js\?v=[^"]+)"/)[1];
          let ready=false;
          for(let attempt=0;attempt<30;attempt++){
            try{
              const response=await fetch(`https://magicmet.ru/?deployment-check=${process.env.GITHUB_SHA}`,{signal:AbortSignal.timeout(15000)});
              if(response.ok&&(await response.text()).includes(expected)){ready=true;break;}
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          if(!ready)throw new Error('Updated homepage script did not appear; publication is not confirmed');
          JS
      - name: Check compact mobile hero and unchanged desktop photo
        run: |
          mkdir -p docs/ai/live-hero-check
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          import {gzipSync} from 'node:zlib';
          const out='docs/ai/live-hero-check';
          const transparentSource='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
          const results=[];
          const searchResults=[];
          const buyerResults=[];
          const browser=await chromium.launch();
          try {
            for(const width of [390,900,1536]) for(const javaScriptEnabled of [false,true]) for(const blocked of [false,true]) {
              const mobile=width<=900;
              const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1.25,javaScriptEnabled});
              let heroRequests=0;
              let heroResponse;
              page.on('request',r=>{if(r.url().includes('/images/hero-'))heroRequests++});
              page.on('response',r=>{if(/\/images\/hero-photo-\d+\.avif(?:\?|$)/.test(r.url())&&r.ok())heroResponse=r});
              if(blocked)await page.route('**/images/**',r=>r.abort());
              try {
                const response=await page.goto(`https://magicmet.ru/?verify=${process.env.GITHUB_SHA}`,{waitUntil:'domcontentloaded',timeout:45000});
                const image=page.locator('.hero-image img');
                if(mobile||!blocked)await image.evaluate(image=>image.decode());
                const photo=await image.evaluate(image=>({
                  complete:image.complete,
                  width:image.naturalWidth,
                  height:image.naturalHeight,
                  currentSrc:image.currentSrc,
                  displayWidth:image.getBoundingClientRect().width,
                  displayHeight:image.getBoundingClientRect().height,
                }));
                // Decode received AVIF bytes separately; this introduces no second HTTP request.
                const sourcePhoto=!mobile&&!blocked&&heroResponse?await page.evaluate(async base64=>{
                  const source=new Image();source.src=`data:image/avif;base64,${base64}`;await source.decode();
                  return {width:source.naturalWidth,height:source.naturalHeight};
                },(await heroResponse.body()).toString('base64')):null;
                const heroBytes=!mobile&&!blocked&&heroResponse?(await heroResponse.body()).length:0;
                const pageState=await page.evaluate(()=>({
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  background:getComputedStyle(document.querySelector('.hero')).backgroundColor,
                  mosaicDisplay:getComputedStyle(document.querySelector('.hero-mosaic')).display,
                  footerColors:[...document.querySelectorAll('.footer-contacts a')].map(node=>getComputedStyle(node).color),
                  footerWeights:[...document.querySelectorAll('.footer-contacts a')].map(node=>getComputedStyle(node).fontWeight),
                  overlayDisplay:getComputedStyle(document.querySelector('.hero'),'::after').display,
                  activePreloads:[...document.querySelectorAll('link[rel="preload"][as="image"]')].filter(node=>!node.getAttribute('media')||matchMedia(node.getAttribute('media')).matches).length,
                }));
                const headingVisible=await page.locator('h1').isVisible();
                const actionVisible=await page.locator('.hero-actions .button').isVisible();
                const html=await response.text();
                const documentHeaders=await response.allHeaders();
                const delivery={contentEncoding:documentHeaders['content-encoding']||'identity',cacheControl:documentHeaders['cache-control']||null,vary:documentHeaders.vary||null,contentLength:documentHeaders['content-length']||null,cdnCache:documentHeaders['x-vercel-cache']||null};
                const inlineImages=html.match(/data:image\/[^"'\s<>]+/g)||[];
                const row={width,mobile,blocked,http:response.status(),photo,sourcePhoto,heroBytes,heroRequests,headingVisible,actionVisible,javaScriptEnabled,delivery,...pageState,htmlGzip:gzipSync(Buffer.from(html)).length};
                const common=row.http===200&&headingVisible&&actionVisible&&row.overflow===0&&row.footerColors.length===5&&row.footerColors.every(color=>color==='rgb(7, 87, 232)')&&row.footerWeights.every(weight=>weight==='700')&&row.htmlGzip<15000&&inlineImages.length===1&&inlineImages[0]===transparentSource;
                const displayed=photo.displayWidth>0&&photo.displayHeight>0;
                row.passed=common&&(mobile
                  ? photo.complete&&photo.currentSrc===transparentSource&&photo.width===1&&photo.height===1&&!displayed&&pageState.mosaicDisplay==='none'&&pageState.overlayDisplay==='none'&&pageState.activePreloads===0&&heroRequests===0
                  : pageState.activePreloads===1&&heroRequests===1&&(blocked
                    ? pageState.background!=='transparent'&&pageState.background!=='rgba(0, 0, 0, 0)'
                    : photo.complete&&displayed&&sourcePhoto?.width===1440&&sourcePhoto?.height===810&&new URL(photo.currentSrc).pathname==='/images/hero-photo-1440.avif'&&heroBytes===73884));
                results.push(row);
              }catch(error){results.push({width,mobile,javaScriptEnabled,blocked,passed:false,error:error.message});}
              await page.screenshot({path:`${out}/${width}-${javaScriptEnabled?'js':'no-js'}-${blocked?'blocked':'normal'}.png`}).catch(()=>{});
              await page.close();
            }
            // The requested grade must already be in server HTML, before hydration.
            for(const width of [390,1536]) {
              const page=await browser.newPage({viewport:{width,height:900},javaScriptEnabled:false});
              try {
                const response=await page.goto(`https://magicmet.ru/poisk?q=${encodeURIComponent('12Х1МФ')}`,{waitUntil:'load',timeout:45000});
                const state=await page.evaluate(()=>({query:document.querySelector('#catalog-query').value,first:document.querySelector('.search-results > a h2')?.textContent,count:document.querySelectorAll('.search-results > a').length,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
                searchResults.push({width,...state,passed:response.status()===200&&state.query==='12Х1МФ'&&state.first==='12Х1МФ'&&state.count>0&&state.count<40&&state.overflow===0});
                await page.screenshot({path:`${out}/search-${width}.png`});
              }catch(error){searchResults.push({width,passed:false,error:error.message});}
              await page.close();
            }
            for(const width of [390,1536]) {
              const page=await browser.newPage({viewport:{width,height:900},javaScriptEnabled:true});
              let postAttempts=0;
              // QA clicks must neither submit a real lead nor send synthetic goals.
              await page.route('**/*',route=>{
                const request=route.request(),url=new URL(request.url());
                if(request.method()==='POST'&&url.pathname==='/api/request'){postAttempts++;return route.abort();}
                if(/(^|\.)(yandex\.(ru|com)|yastatic\.net)$/.test(url.hostname))return route.abort();
                return route.continue();
              });
              try {
                await page.goto('https://magicmet.ru/#request',{waitUntil:'domcontentloaded',timeout:45000});
                const input=page.locator('input[name="files"]'),feedback=page.locator('#file-selection-status');
                const empty={name:'qa-empty.pdf',mimeType:'application/pdf',buffer:Buffer.alloc(0)};
                const valid={name:'qa-valid.pdf',mimeType:'application/pdf',buffer:Buffer.from('%PDF-1.4\nQA only; never submitted')};
                await input.setInputFiles(empty);
                await feedback.waitFor({state:'visible'});
                const emptyText=await feedback.textContent();
                await input.setInputFiles([empty,valid]);
                const mixedText=await feedback.textContent();
                await input.setInputFiles([empty,{name:'qa-invalid.exe',mimeType:'application/octet-stream',buffer:Buffer.from('QA')}]);
                const invalidMixedText=await feedback.textContent();
                await input.setInputFiles([empty,{name:'qa-large.pdf',mimeType:'application/pdf',buffer:Buffer.alloc(4*1024*1024+1)}]);
                const oversizedMixedText=await feedback.textContent();
                await input.setInputFiles(valid);
                const validText=await feedback.textContent();
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
                const fieldFont=await page.locator('input[name=email]').evaluate(node=>parseFloat(getComputedStyle(node).fontSize));
                buyerResults.push({kind:'attachment-feedback',width,emptyText,mixedText,invalidMixedText,oversizedMixedText,validText,overflow,fieldFont,postAttempts,passed:emptyText.includes('Пустые файлы')&&!emptyText.includes('Файлы готовы')&&mixedText.includes('Остальные непустые файлы можно отправить')&&!mixedText.includes('Файлы готовы')&&!invalidMixedText.includes('Остальные непустые файлы можно отправить')&&invalidMixedText.includes('Проверьте остальные вложения')&&!oversizedMixedText.includes('Остальные непустые файлы можно отправить')&&oversizedMixedText.includes('Проверьте остальные вложения')&&validText.includes('Файлы готовы')&&overflow===0&&(width>900||fieldFont>=16)&&postAttempts===0});
                await feedback.scrollIntoViewIfNeeded();
                await page.screenshot({path:`${out}/files-${width}.png`});
              }catch(error){buyerResults.push({kind:'attachment-feedback',width,passed:false,error:error.message});}
              await page.close();

              const goalsPage=await browser.newPage({viewport:{width,height:900},javaScriptEnabled:true});
              await goalsPage.route('**/*',route=>{
                const request=route.request(),url=new URL(request.url());
                if(request.method()==='POST'&&url.pathname==='/api/request')return route.abort();
                if(/(^|\.)(yandex\.(ru|com)|yastatic\.net)$/.test(url.hostname))return route.abort();
                return route.continue();
              });
              await goalsPage.addInitScript(()=>{
                window.qaSizeGoals=[];
                document.addEventListener('magicmet:goal',event=>{if(event.detail==='size_selected')window.qaSizeGoals.push(event.detail)});
                document.addEventListener('click',event=>{if(event.target.closest?.('.size-series-pair-list a,.search-results a'))event.preventDefault()});
              });
              try {
                await goalsPage.goto('https://magicmet.ru/produkciya/truby-besshovnye/goryachedeformirovannye#sizes',{waitUntil:'load',timeout:45000});
                await goalsPage.locator('.size-series-pair-list a').first().click({timeout:20000});
                const compactGoals=await goalsPage.evaluate(()=>window.qaSizeGoals.length);
                await goalsPage.goto(`https://magicmet.ru/poisk?q=${encodeURIComponent('57×3')}`,{waitUntil:'load',timeout:45000});
                await goalsPage.locator('.search-results a[href*="size_1=57"][href*="wall_1=3"]').first().click({timeout:20000});
                const dimensionGoals=await goalsPage.evaluate(()=>window.qaSizeGoals.length);
                await goalsPage.goto(`https://magicmet.ru/poisk?q=${encodeURIComponent('12Х1МФ')}`,{waitUntil:'load',timeout:45000});
                await goalsPage.locator('.search-results a').first().click({timeout:15000});
                const plainTextGoals=await goalsPage.evaluate(()=>window.qaSizeGoals.length);
                buyerResults.push({kind:'size-selection-goals',width,compactGoals,dimensionGoals,plainTextGoals,passed:compactGoals===1&&dimensionGoals===1&&plainTextGoals===0});
              }catch(error){buyerResults.push({kind:'size-selection-goals',width,passed:false,error:error.message});}
              await goalsPage.close();
            }
          }finally{await browser.close();}
          fs.writeFileSync(`${out}/result.json`,JSON.stringify({checkedAt:new Date().toISOString(),sourceCommit:process.env.GITHUB_SHA,results,searchResults,buyerResults,passed:results.length===12&&results.every(r=>r.passed)&&searchResults.length===2&&searchResults.every(r=>r.passed)&&buyerResults.length===4&&buyerResults.every(r=>r.passed)},null,2));
          console.log(JSON.stringify(results));
          JS
      - name: Save evidence to separate report branch
        if: always()
        run: |
          mkdir -p docs/ai/live-hero-check
          test -f docs/ai/live-hero-check/result.json || printf '%s\n' '{"passed":false,"error":"Runner setup failed before browser checks"}' > docs/ai/live-hero-check/result.json
          report_dir="$(mktemp -d)"
          cp -a docs/ai/live-hero-check/. "$report_dir/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf docs/ai/live-hero-check
          if git ls-remote --exit-code --heads origin refs/heads/codex/live-hero-check >/dev/null; then
            git fetch --no-tags origin refs/heads/codex/live-hero-check
            git checkout -B codex/live-hero-check FETCH_HEAD
          else
            branch_status=$?
            test "$branch_status" -eq 2 || exit "$branch_status"
            git fetch --no-tags origin refs/heads/main
            git checkout -B codex/live-hero-check FETCH_HEAD
          fi
          rm -rf docs/ai/live-hero-check
          mkdir -p docs/ai/live-hero-check
          cp -a "$report_dir/." docs/ai/live-hero-check/
          git add docs/ai/live-hero-check
          if ! git diff --cached --quiet; then
            git commit -m "Record published hero browser verification"
          fi
          git push origin HEAD:refs/heads/codex/live-hero-check
      - name: Require success
        run: node -e "if(!require('./docs/ai/live-hero-check/result.json').passed)process.exit(1)"
