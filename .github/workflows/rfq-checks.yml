name: RFQ checks

on:
  push:
    branches:
      - codex/rfq-metalinfo-freshness-20260914
  pull_request:
    branches:
      - rfq-workbench-mvp
    paths:
      - 'src/lib/procurement/**'
      - 'src/components/RFQWorkbench.tsx'
      - 'tests/int/metalinfo-adapter.int.spec.ts'
      - 'tests/int/procurement-engine.int.spec.ts'
      - 'tests/int/workbench.int.spec.ts'
      - 'tests/int/rfq-workbench-ui.int.spec.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rfq-checks.yml'

permissions:
  contents: read

concurrency:
  group: rfq-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run RFQ integration tests
        run: npx vitest run --config ./vitest.config.mts tests/int/metalinfo-adapter.int.spec.ts tests/int/procurement-engine.int.spec.ts tests/int/workbench.int.spec.ts tests/int/rfq-workbench-ui.int.spec.ts

