name: RFQ checks

on:
  pull_request:
    branches:
      - rfq-workbench-mvp
    paths:
      - 'src/lib/procurement/**'
      - 'src/components/RFQWorkbench.tsx'
      - 'tests/int/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rfq-checks.yml'

permissions:
  contents: read

concurrency:
  group: rfq-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:int
