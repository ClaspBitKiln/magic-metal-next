name: Catalog QA

on:
  pull_request:
    paths:
      - 'src/data/**'
      - 'tests/catalog-coverage.test.ts'
      - 'tests/tubeMaster.test.ts'
      - 'src/lib/tubeMaster.ts'
      - 'src/app/api/internal/tubes/**'
      - '.agents/skills/**'
      - 'AGENTS.md'

concurrency:
  group: catalog-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run catalog and Tube Master tests
        run: npm run test:int -- tests/catalog-coverage.test.ts tests/tubeMaster.test.ts
