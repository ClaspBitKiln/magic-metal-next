name: Catalog live link audit

on:
  # Wide live audits are opt-in; automatic post-deploy browser QA remains.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all public catalog links
        run: node scripts/audit-live-catalog.mjs
        env:
          CATALOG_BASE_URL: https://magicmet.ru
      - name: Save complete URL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-live-audit
          path: catalog-live-audit.md
          if-no-files-found: ignore
